services:
  frontend:
    build: ./frontend
    container_name: proyecto_frontend
    ports:
      - "${FRONTEND_PORT}:5520"
    depends_on:
      - backend
    networks:
      - proyecto_network

  backend:
    build: ./backend
    container_name: proyecto_backend
    ports:
      - "${BACKEND_PORT}:5000"
    environment:
      MONGO_USER: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_HOST: mongo
      MONGO_DATABASE: ${MONGO_DATABASE}
    depends_on:
      - mongo
    networks:
      - proyecto_network

  mongo:
    image: mongo:7
    container_name: proyecto_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongo_data:/data/db
      - ./database/init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - proyecto_network

volumes:
  mongo_data:

networks:
  proyecto_network:
    driver: bridge