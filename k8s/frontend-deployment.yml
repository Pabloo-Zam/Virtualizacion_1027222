apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 1027222_pablozamora-frontend:2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000