apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: us-central1-docker.pkg.dev/silver-theme-497018-p5/repo-virtualizacion/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          resources:
            limits:
              cpu: "250m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "512Mi"
          env:
            - name: MONGO_USER
              value: admin
            - name: MONGO_PASSWORD
              value: admin123
            - name: MONGO_HOST
              value: mongo
            - name: MONGO_DATABASE
              value: proyecto_db